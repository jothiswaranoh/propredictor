version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: football_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - football_network

  api:
    build: .
    container_name: football_api
    ports:
      - "8010:8010"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/football_prediction

      - JWT_SECRET=supersecretjwtsecretkeychangeinproduction12345
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DEFAULT_ADMIN_EMAIL=admin@company.com
      - DEFAULT_ADMIN_PASSWORD=EMP001
      - DEFAULT_ADMIN_NAME=System Administrator
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - football_network

volumes:
  mongo_data:

networks:
  football_network:
    driver: bridge
